<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ALE TV - LIVE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;font-family:sans-serif;overflow:hidden}#top{position:absolute;top:0;left:0;width:100%;height:48px;background:#0a1931;border-bottom:3px solid #ff6a00;display:flex;align-items:center;justify-content:space-between;padding:0 12px;z-index:1000;color:#fff}#top b{color:#fff}#top span{color:#ff6a00}#live{background:red;color:#fff;padding:4px 10px;border-radius:12px;font-size:12px;animation:blink 1s infinite}@keyframes blink{50%{opacity:.5}}#wrap{position:relative;width:100vw;height:100vh;padding-top:48px}#wrap iframe{position:absolute;top:48px;left:0;width:100%;height:calc(100% - 48px);border:0;pointer-events:none}#shield{position:absolute;top:48px;left:0;width:100%;height:calc(100% - 48px);z-index:999;background:transparent}</style></head><body><div id="top"><div><b>AZAM</b> <span>ALE TV</span></div><div id="live">● LIVE</div></div><div id="wrap"><iframe id="yt" allow="autoplay; fullscreen" allowfullscreen></iframe><div id="shield"></div></div><script>let vid=localStorage.getItem('ale_current_video');if(!vid){try{let a=JSON.parse(localStorage.getItem('ale_videos')||'[]');if(a[0])vid=a[0].id||a[0].youtubeId}catch(e){}}vid=vid||'MvtfgPnvq-U';document.getElementById('yt').src='https://www.youtube.com/embed/'+vid+'?autoplay=1&controls=0&disablekb=1&fs=0&modestbranding=1&rel=0&iv_load_policy=3';document.addEventListener('contextmenu',e=>e.preventDefault());</script></body></html>
