<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AZAM ALE TV LIVE</title>
<style>body{margin:0;background:#000;color:#fff;font-family:sans-serif}#top{background:#111;padding:14px;display:flex;justify-content:space-between}#player{width:100%;height:56vh;background:#111;display:flex;align-items:center;justify-content:center}#now{padding:12px}.item{background:#1a1a2e;padding:14px;margin:8px;border-radius:12px;cursor:pointer}.live{background:red;padding:5px 12px;border-radius:20px;font-size:12px}</style>
</head><body>
<div id="top"><b>AZAM ALE TV</b><span class="live">● LIVE</span></div>
<div id="player">Hakuna video</div>
<h3 id="now"></h3>
<div id="list" style="padding:10px"></div>
<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
function render(){
 let vids=getV();
 if(vids.length==0){
   document.getElementById('player').innerHTML='<div style=text-align:center;padding:30px>Hakuna video bado<br><small style=color:orange>Ingia /admin.html kuweka</small><br><br><small style=color:#666>Videos: '+localStorage.getItem('ale_videos')+'</small></div>';
   document.getElementById('list').innerHTML='';
   return;
 }
 play(vids[vids.length-1].id,vids[vids.length-1].title);
 let h='';
 for(let i=vids.length-1;i>=0;i--){
  let v=vids[i];
  h+='<div class=item onclick="play(\''+v.id+'\',\''+v.title.replace(/'/g,'')+'\')"><b>'+v.title+'</b><br><small>'+v.cat+'</small></div>';
 }
 document.getElementById('list').innerHTML=h;
}
window.play=function(id,t){
 document.getElementById('player').innerHTML='<iframe width="100%" height="100%" src="https://www.youtube.com/embed/'+id+'?autoplay=1" frameborder=0 allowfullscreen></iframe>';
 document.getElementById('now').innerText=t;
}
render();
</script>
</body></html>
