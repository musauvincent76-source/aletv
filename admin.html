<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title></head><body style="background:#0a0a14;color:#fff;padding:15px;font-family:sans-serif">
<h3>ADMIN - Weka YouTube</h3>
<input id="vTitle" placeholder="Jina" style="width:100%;padding:10px;margin:5px 0">
<input id="vLink" placeholder="https://youtu.be/..." style="width:100%;padding:10px;margin:5px 0">
<button onclick="addVideo()" style="width:100%;padding:12px;background:#ff2d55;color:#fff;border:none;border-radius:8px">+ WEKA VIDEO</button>
<div id="list" style="margin-top:20px"></div>
<div id="preview" style="margin-top:20px"></div>
<script>
function getId(u){let m=u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([\w-]{11})/);return m?m[1]:null}
function getV(){return JSON.parse(localStorage.getItem('aleTvVideos')||'[]')}
function save(v){localStorage.setItem('aleTvVideos',JSON.stringify(v));render()}
function addVideo(){let t=document.getElementById('vTitle').value.trim();let l=document.getElementById('vLink').value.trim();if(!t||!l)return alert('Weka jina na link');let id=getId(l);if(!id)return alert('Link si YouTube');let v=getV();v.push({id:id,title:t});save(v);document.getElementById('vTitle').value='';document.getElementById('vLink').value='';}
function del(i){let v=getV();v.splice(i,1);save(v)}
function render(){let v=getV();let h='';v.slice().reverse().forEach((x,i)=>{let idx=v.length-1-i;h+=`<div style="background:#1a1a2e;padding:10px;margin:8px 0;border-radius:8px;display:flex;justify-content:space-between"><span>${x.title}</span><button onclick="del(${idx})" style="background:red;color:#fff;border:none;padding:5px 10px">X</button></div>`});document.getElementById('list').innerHTML=h||'Hakuna';if(v.length>0){document.getElementById('preview').innerHTML=`<iframe width="100%" height="200" src="https://www.youtube.com/embed/${v[0].id}" frameborder="0" allowfullscreen></iframe>`}}
render();
</script></body></html>
