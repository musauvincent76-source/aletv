<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN ALE TV</title>
<style>
body{margin:0;background:#0a0a1a;color:#fff;font-family:sans-serif;padding:15px}
input,select{width:100%;padding:15px;margin:8px 0;border-radius:12px;border:none;background:#1a1a2e;color:#fff;box-sizing:border-box;font-size:16px}
button{width:100%;padding:15px;background:#ff6b00;border:none;border-radius:12px;color:#fff;font-weight:bold;font-size:16px}
.item{background:#1a1a2e;padding:12px;margin:8px 0;border-radius:10px}
</style>
</head>
<body>
<h2>ADMIN - ALE TV</h2>
<input id="t" placeholder="Jina la video">
<input id="l" placeholder="Link ya YouTube">
<select id="c"><option>Burudani</option><option>Habari</option><option>Muziki</option></select>
<button onclick="addVideo()">WEKA KWENYE TV</button>
<button onclick="clearAll()" style="background:#333;margin-top:8px">Futa Zote</button>
<div id="list" style="margin-top:20px"></div>
<p><a href="index.html" style="color:orange">Fungua TV</a></p>
<script>
function getV(){return JSON.parse(localStorage.getItem('ale_videos')||'[]')}
function saveV(v){localStorage.setItem('ale_videos',JSON.stringify(v))}
function getId(u){
 var m=u.match(/(?:youtu\.be\/|v=|embed\/)([^&?\/]+)/);
 return m?m[1]:u.trim()
}
function addVideo(){
 var title=document.getElementById('t').value.trim();
 var link=document.getElementById('l').value.trim();
 var cat=document.getElementById('c').value;
 if(!title){alert('WEKA JINA');return}
 if(!link){alert('WEKA LINK');return}
 var v=getV();
 v.push({id:getId(link),title:title,cat:cat});
 saveV(v);
 document.getElementById('t').value='';
 document.getElementById('l').value='';
 showList();
 alert('Imewekwa! Fungua TV sasa');
}
function delV(i){
 var v=getV();
 v.splice(i,1);
 saveV(v);
 showList();
}
function clearAll(){
 if(confirm('Futa zote?')){
  localStorage.removeItem('ale_videos');
  showList();
 }
}
function showList(){
 var v=getV();
 var h='';
 for(var i=v.length-1;i>=0;i--){
  h+='<div class=item><b>'+v[i].title+'</b><br><small>'+v[i].cat+' - '+v[i].id+'</small><br><button onclick="delV('+i+')" style="width:auto;background:red;padding:6px 12px;margin-top:6px">Futa</button></div>';
 }
 document.getElementById('list').innerHTML=h||'Hakuna video';
}
showList();
</script>
</body>
</html>
